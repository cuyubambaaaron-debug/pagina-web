<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pared de vídeos</title>
<link rel="stylesheet" href="pared.css">
</head>
<body>
<section class="portada">
  <div class="texto">
    <h1>Lo viste en 50 segundos. <span>Aquí está el resto.</span></h1>
    <p>Cambia cada recuadro por un fotograma de tus vídeos (formato 9:16) y listo.</p>
  </div>
  <!-- Cada columna repite su lista dos veces: así el bucle no se nota -->
  <div class="pared" aria-hidden="true">
    <div class="col">
      <div class="v" style="--h:220">1</div><div class="v" style="--h:280">2</div><div class="v" style="--h:330">3</div><div class="v" style="--h:20">4</div>
      <div class="v" style="--h:220">1</div><div class="v" style="--h:280">2</div><div class="v" style="--h:330">3</div><div class="v" style="--h:20">4</div>
    </div>
    <div class="col sube">
      <div class="v" style="--h:40">5</div><div class="v" style="--h:190">6</div><div class="v" style="--h:300">7</div><div class="v" style="--h:160">8</div>
      <div class="v" style="--h:40">5</div><div class="v" style="--h:190">6</div><div class="v" style="--h:300">7</div><div class="v" style="--h:160">8</div>
    </div>
    <div class="col">
      <div class="v" style="--h:350">9</div><div class="v" style="--h:200">10</div><div class="v" style="--h:60">11</div><div class="v" style="--h:250">12</div>
      <div class="v" style="--h:350">9</div><div class="v" style="--h:200">10</div><div class="v" style="--h:60">11</div><div class="v" style="--h:250">12</div>
    </div>
  </div>
</section>
</body>
</html>
